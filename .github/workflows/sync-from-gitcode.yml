name: Sync from GitCode

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check sync flag on GitCode
        id: flag
        run: |
          git clone --depth 1 --branch master https://gitcode.com/VictorTop/Fist-Mbt.git /tmp/check
          if [ -f /tmp/check/.sync-to-github ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync GitCode to GitHub (add-only, GitCode as source)
        if: steps.flag.outputs.enabled == 'true'
        run: |
          set -e
          git clone --no-single-branch https://gitcode.com/VictorTop/Fist-Mbt.git /tmp/repo
          cd /tmp/repo
          git remote add gh "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git fetch gh
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 1) 用 GitHub 版 .github/workflows 完全替换本地（保留 CI 配置，避免创建新 workflow 被 GitHub 安全机制拒绝）
          git rm -r --cached .github/workflows >/dev/null 2>&1 || true
          rm -rf .github/workflows
          git checkout "gh/master" -- .github/workflows >/dev/null 2>&1 || true
          git add .github/workflows
          git commit -m "chore: preserve GitHub workflow files (add-only sync)" >/dev/null 2>&1 || true

          # 2) 推送所有 GitCode 分支：GitCode 为源，覆盖 GitHub 同名分支；GitHub 独有分支保留
          # ⚠️ 失败**不吞**：逐个收集到 FAILED_BRANCHES，结尾聚合点名并以非零退出（check_sync_workflow_reports_failures S1/S2/S3）
          BRANCHES="$(git for-each-ref --format='%(refname:short)' refs/heads)"
          # S4：「枚举面为空」守卫 —— 0 支会被读成健康读数，必须显式报错
          if [ -z "$BRANCHES" ]; then
            echo "::error::枚举面为空：git for-each-ref 没有返回任何分支（0 支会被误读成健康读数）"
            exit 1
          fi
          OK_COUNT=0
          FAIL_COUNT=0
          FAILED_BRANCHES=""
          SKIP_COUNT=0
          SKIPPED_BRANCHES=""
          # 0) 「反丢历史」前置：只读拉一次 GitHub 侧分支引用，供下面的祖先判定用。
          #    2026-10-28 实测事故：本 workflow 以 GitCode 为准 force 覆盖 GitHub 同名分支，
          #    把 GitHub master 上的 431 笔提交（含当日 159 笔）整体抹掉，而 workflow 自己报绿。
          #    `--force` 单独用是「源侧永远赢」，而 GitHub 侧才是这仓的活跃交付线 ⇒ 必须先判定。
          git fetch gh '+refs/heads/*:refs/remotes/gh/*' >/dev/null 2>&1 || true
          for b in $BRANCHES; do
            # ⚠️ 反丢历史守卫：GitHub 侧若存在**源侧没有**的提交，force 会静默抹掉它们 ⇒ 跳过并点名。
            #    只有「GitHub 侧是本分支祖先」（纯快进）才允许 force 覆盖。
            if git rev-parse --verify --quiet "refs/remotes/gh/$b" >/dev/null 2>&1; then
              if ! git merge-base --is-ancestor "refs/remotes/gh/$b" "$b"; then
                SKIP_COUNT=$((SKIP_COUNT + 1))
                SKIPPED_BRANCHES="$SKIPPED_BRANCHES $b"
                echo "::warning::skip branch(has-unique-commits): $b"
                continue
              fi
            fi
            if git push --force gh "$b:$b"; then
              OK_COUNT=$((OK_COUNT + 1))
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
              FAILED_BRANCHES="$FAILED_BRANCHES $b"
              echo "::warning::failed branch: $b"
            fi
          done

          # 3) 默认分支映射：GitCode master -> GitHub master（**同样受反丢历史守卫约束**）
          MASTER_UNSAFE=0
          if git rev-parse --verify --quiet refs/remotes/gh/master >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor refs/remotes/gh/master master; then
              MASTER_UNSAFE=1
            fi
          fi
          #    若 `master` 已在第 2 步的 `for b in $BRANCHES` 里推过，这里**不再推一次**：
          #    重复推会让 `OK=` 计数虚高（实测 fixtures 3 支可推却读到 OK=4），也白跑一次网络。
          MASTER_IN_BRANCHES=0
          if echo "$BRANCHES" | grep -qx master; then
            MASTER_IN_BRANCHES=1
          fi
          if [ "$MASTER_IN_BRANCHES" = "1" ]; then
            : # 已在分支循环里处理（含反丢历史守卫），不重复推
          elif [ "$MASTER_UNSAFE" = "1" ]; then
            SKIP_COUNT=$((SKIP_COUNT + 1))
            SKIPPED_BRANCHES="$SKIPPED_BRANCHES master(default)"
            echo "::warning::skip branch(has-unique-commits): master (default branch mapping)"
          elif git push --force gh "master:master"; then
            OK_COUNT=$((OK_COUNT + 1))
          else
            FAIL_COUNT=$((FAIL_COUNT + 1))
            FAILED_BRANCHES="$FAILED_BRANCHES master(default)"
            echo "::warning::failed branch: master (default branch mapping)"
          fi

          # 4) 标签只增不删（GitHub 已存在的同名标签会拒绝，保留 GitHub 版）
          #    标签推送失败是**预期**的（同名标签拒绝），所以这里不判红，但如实计数
          if git push gh --tags; then
            TAGS_RESULT=ok
          else
            TAGS_RESULT=partial-or-skipped
          fi

          # S2/S3：聚合读数 + 失败点名（同一行 echo 里 OK=… 与 FAIL=… 同现）
          echo "OK=$OK_COUNT FAIL=$FAIL_COUNT SKIP=$SKIP_COUNT TAGS=$TAGS_RESULT FAILED_BRANCHES=${FAILED_BRANCHES:-none} SKIPPED=${SKIPPED_BRANCHES:-none}"
          if [ "$FAIL_COUNT" -ne 0 ]; then
            echo "::warning::failed branches:${FAILED_BRANCHES}"
            echo "::error::failed branches:${FAILED_BRANCHES}"
            exit 1
          fi
          echo "::notice::sync complete: OK=$OK_COUNT FAIL=0"
