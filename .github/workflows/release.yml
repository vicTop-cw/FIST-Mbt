# .github/workflows/release.yml
# FIST-Mbt 黑盒化分发 —— Release Pipeline
# 触发: tag v* (push v0.2.6, v0.3.0 等)
# 产物: JS 版 zip + Linux Native 版 zip + (Windows Native 可选) → 上传到 GitHub Releases

name: FIST-Mbt Blackbox Release

on:
  push:
    tags:
      # GitHub Actions 的 ref 过滤器不支持 [0-9] 字符类：旧写法对已推上去的
      # v0.3.0 / v0.3.0-beta 两个 tag 实测触发次数 0 ⇒ Release 从未产出过。
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Override version (default: from tag)'
        required: false
        default: ''

permissions:
  contents: write

env:
  # BUG-513 出路①：MOON_VERSION 不再钉死在这里（曾写 'latest' ⇒ nightly 漂移，
  # v0.3.10/v0.3.11 两发 native 臂同红）。钉版改由 meta 作业从 toolchain.json
  # （J17 机器可读真源）读出、经 needs.meta.outputs.moonbit 下发到各 Install MoonBit 步。
  NODE_VERSION: '24'
  TAG: ${{ github.ref_name }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      moonbit: ${{ steps.toolchain.outputs.moonbit }}
    steps:
      # 这一格原来**没有 checkout**：tag push 时版本从 `GITHUB_REF_NAME` 剥出来，不读盘 ⇒ 一直没暴露；
      # 2026-10-31 首次 `workflow_dispatch` 实测红在第一步 ——
      # `FileNotFoundError: [Errno 2] No such file or directory: 'moon.mod'`，
      # 于是 else 分支那条「退回真源 moon.mod」的出路**从来没跑通过**，并连带把四个下游全 skip 掉。
      # 读盘的那条路必须先有盘：补 checkout，且注释里的正则口径保持与 gen_plugins.py 的 RE_VERSION 同源。
      - uses: actions/checkout@v4
      - id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == v* ]]; then
            VER="${REF#v}"
          else
            # workflow_dispatch 时 ref_name 是分支名，剥不出版本 ⇒ 退回真源 moon.mod
            # workflow_dispatch 的 version 入参两种写法都收（v0.3.11 / 0.3.11）：
            # tag push 路径已由 REF#v 剥掉 v，dispatch 路径原样透传 ⇒ 带 v 的入参会让
            # 下游全部双写 v（资产名 fist-mbt-js-vv0.3.11.zip、linux 版本闸期望
            # FIST-Mbt vv0.3.11）。run 41279525445 / 41280902551 实测：native 产物
            # rc=0、回执 [FIST-Mbt v0.3.11] 完全健康，纯粹是闸拿 v$VER 去比 ⇒
            # 归一化只在 meta 这一处做，下游语义不变。
            VER="${{ inputs.version }}"
            VER="${VER#v}"
            if [[ -z "$VER" ]]; then
              # 版本真源 = moon.mod（本仓没有 moon.mod.json）；正则与 scripts/gen_plugins.py 的
              # RE_VERSION 同一条，避免两处解析口径分叉。
              VER=$(python3 -c "import re;m=re.search(r'^version\\s*=\\s*\"([^\"]+)\"', open('moon.mod').read(), re.M);print(m.group(1) if m else '')")
            fi
            if [[ -z "$VER" ]]; then
              echo "FATAL: 从 moon.mod 取不到 version ⇒ 宁可让发布红，也不产出 fist-mbt-js-v.zip 这种空版本资产"
              exit 1
            fi
          fi
          echo "value=${VER}" >> "$GITHUB_OUTPUT"

      # BUG-513 出路①：moon 钉版读 toolchain.json（唯一机器可读真源），
      # 不把版本数字写死在 workflow 里。
      - id: toolchain
        run: echo "moonbit=$(python3 -c "import json;print(json.load(open('toolchain.json'))['moonbit'])")" >> "$GITHUB_OUTPUT"

  build-js:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        env:
          # BUG-513 出路①：钉版来自 toolchain.json（经 meta 作业读出），不再 'latest'
          MOON_VERSION: ${{ needs.meta.outputs.moonbit }}
        run: |
          # BUG-112：这一格的 bootstrap 与 ci.yml 里**验证过的**形状不一致 —— 安装 URL 少了 `.sh`，
          # 而且没把 $HOME/.moon/bin 写进 GITHUB_PATH ⇒ 后续步骤里 `moon` 不在 PATH，
          # build-js 直接红 ⇒ release 作业被 skip ⇒ Release 零资产（默认安装线一直 404 的最后一段真因）。
          # 注意：本机装了全局 moon，所以"在快照树里复跑 CI 的三步"是绿的——这条只在 runner 上现形。
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry (first build)
        run: moon update

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 2026-10-30：RX-MBT 已升 0.4.0，`Number(id)` 归一由上游原生实现，
      # 原 `patches/rx-mbt-bug480/reapply.sh` 与其 reapply 步骤一并删除（BUG-480 上游已收编）。
      # BUG-488（R256）：仍必须先解包依赖 —— `moon update` 只拉注册表索引，
      # `.mooncakes/` 在 `moon check` 触发解包前不存在（ci.yml:447 已知坑，release 漏配）
      # ⇒ 不做 migrate 就会 build 失败 ⇒ release skipped ⇒ Release 零资产。
      - name: Migrate mooncakes dep manifests (解包依赖 + 迁旧 moon.mod.json)
        shell: bash
        run: bash scripts/migrate_mooncakes_modjson.sh "moon check --target js"


      - name: Build JS target
        run: |
          # 2026-10-13 run#6 红在此步（`moon build --target js` 退出 255）：moon 0.1.20261012+
          # 拒绝依赖图里旧格式的 `.mooncakes/<dep>/moon.mod.json`（`is no longer supported`），
          # 而 `.mooncakes/` 在 .gitignore、由 `moon update` 重生成 ⇒ 本机老版 moon 复现不出来
          # （与 BUG-112 同形：只在 runner 现形）。迁移器就地 fmt 每个被判过期的依赖目录，
          # 循环到 build 收敛（惰性解包决定不能一次性 find）——WSL 隔离副本（CI 同版 moon）实测
          # 3 轮 rc=0、幂等复跑 no-op。脚本内部就跑 build，exit 0 时产物已在 _build/。
          bash scripts/migrate_mooncakes_modjson.sh
          python3 scripts/patch_esm_main.py _build/js/debug/build/cmd/cli/cli.js

      - name: Package JS artifact
        run: |
          mkdir -p _release/js
          cp _build/js/debug/build/cmd/cli/cli.js _release/js/fist-mbt.js
          cd _release/js && zip -r ../fist-mbt-js-v${{ needs.meta.outputs.version }}.zip . && cd ../..

      - uses: actions/upload-artifact@v4
        with:
          name: fist-mbt-js
          path: _release/fist-mbt-js-v${{ needs.meta.outputs.version }}.zip

  build-native-linux:
    needs: meta
    # BUG-111：native 侧长期不是权威面（AGENTS 自己写明「权威稳定门槛 = JS 后端」），
    # 却在这里一票否决 JS 分发面 ⇒ 一次 native 编译失败就等于 Release 全无资产。
    # 与 build-native-windows 对齐：允许它红，但不许它顶掉发布。
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit
        env:
          # BUG-513 出路①：钉版来自 toolchain.json（经 meta 作业读出），不再 'latest'
          MOON_VERSION: ${{ needs.meta.outputs.moonbit }}
        run: |
          # 同 BUG-112：与 ci.yml 的 bootstrap 对齐（`.sh` + 导出 GITHUB_PATH），否则 `moon` 不在 PATH
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry (first build)
        run: moon update

      # BUG-488（R256）：native 臂同样补「migrate 先解包」（见 js 臂注释）；顺带去掉重复的
      # Install sqlite3 dev 步骤。
      - name: Install sqlite3 dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev sqlite3

      - name: Migrate mooncakes dep manifests (先解包：native check 触发依赖落地)
        # ⚠️ 顺序是**硬前置**，不是排版偏好。本仓 BUG-488 早记过，我第一版又踩了一遍，CI 当场红：
        # `moon update` 只刷新注册表索引，`.mooncakes` 是**惰性解包** —— update 之后那目录根本不存在，
        # 直接 reapply 只得到 `##[error]找不到目标 stub.c：…/.mooncakes/daqing/sqlite/stub.c`。
        # 先跑一次能触发解包的构建。这里用 `moon check --target native`：它只做类型检查、不链可执行文件，
        # 因此不受 BUG-527（库包带 link ⇒ 全项目**构建**必崩）影响 —— ci.yml 的 `Check (native)` 今天仍 success。
        run: bash scripts/migrate_mooncakes_modjson.sh "moon check --target native"

      - name: Reapply BUG-133 sqlite FFI fix
        # ⚠️ 这一步是**承重件**，不是「顺手对齐 ci.yml」（ci.yml 两条 native 臂都有它，release 这条从来没有）：
        # 2026-10-31 WSL 实测同一棵树、同一枚产物，两态对照——
        #   不 reapply：`version` / `--help` / `demo` / 未知子命令 **每次** `free(): invalid pointer`
        #               或 `double free or corruption` ⇒ rc=134（一次 SIGSEGV rc=139）
        #   reapply 后：三臂稳定 rc=0，未知子命令 rc=2
        # ⇒ 过去这条作业即便建出产物，交付的也是一枚「能启动、一用就崩」的二进制（判例-33 第三条）。
        # 必须落在「解包之后、build 之前」：`.mooncakes` 在 .gitignore 里，任何一次 `moon update`/`moon add` 都会整目录重生成。
        run: bash patches/sqlite-bug133/reapply.sh --force

      - name: Build native
        # 只建**可执行包**，不建全项目：2026-10-31 WSL 实测 `moon build --target native`（全项目）
        # 红在 `undefined reference to 'main'` —— moon 0.1.20261021 对**带 `options(link:{native:{...}})`
        # 的库包**也去链可执行文件（`src/core`/`src/router`/`src/store`… 14 个库都中招），
        # 而库没有 `main` ⇒ 必然失败。本仓 15 份 `moon.pkg` 里有 12 份是「库却带 link」，
        # 那是 POLISH 期「全项目内置 -lsqlite3」留下的形状，另立单治理（见 memory/bugs.md）。
        # 真正要发布的只有 `cmd/cli` 一枚，scoped 构建 rc=0 且产物齐全 ⇒ 本轮先让分发面通。
        run: bash scripts/migrate_mooncakes_modjson.sh "moon build --target native cmd/cli"

      - name: Package native artifact
        # 「产物存在」不等于「产物能用」：打包前先**真的调一次**（判例-33），
        # 版本首行逐字对不上、或未知子命令回 rc=0，都宁可不发这枚资产。
        env:
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # ⚠️ Actions 把这段跑成 `bash -e {0}` ⇒ 「**期望非零**」的那一条会把整步直接打死。
          # 2026-10-31 实测：版本闸先 PASS（`version 回执：[FIST-Mbt v0.3.11]`），下一行
          # `fist-mbt definitely-not-real` 正常返回 rc=2 ⇒ errexit 当场吃掉，日志只留
          # `##[error]Process completed with exit code 2`，看着像产物坏了，其实是**闸的写法**坏了。
          # ⇒ 显式收回 -e，逐条自己取 rc：闸的语义是「不对才红」，不是「非零就红」。
          set +e
          set -uo pipefail
          SRC=""
          for c in _build/native/debug/build/cmd/cli/cli _build/native/debug/build/cmd/cli/cli.exe; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "::error::native 产物两把名字都不在（cli / cli.exe）⇒ 判「产物没建出来」，不打 zip"
            exit 1
          fi
          echo "被打包的产物：$SRC"
          mkdir -p _release/native
          cp "$SRC" _release/native/fist-mbt
          chmod +x _release/native/fist-mbt
          if [ ! -f _release/native/fist-mbt ]; then
            echo "::error::复制产物失败（_release/native/fist-mbt 不在）"
            exit 1
          fi
          ./_release/native/fist-mbt version >_gate_version.txt 2>&1
          vrc=$?
          OUT="$(head -1 _gate_version.txt)"
          echo "version rc=$vrc 回执：[$OUT]（期望逐字 [FIST-Mbt v$VER]）"
          if [ "$OUT" != "FIST-Mbt v$VER" ]; then
            echo "::error::native 产物调用面不回显版本 ⇒ 不发一枚「建得出来但回显旧版/一用就崩」的二进制"
            sed -n '1,8p' _gate_version.txt
            exit 1
          fi
          ./_release/native/fist-mbt definitely-not-real >_gate_unknown.txt 2>&1
          rc=$?
          echo "未知子命令 rc=$rc（Linux native 实测应为 2；Windows 面的 rc=0 另有 BUG-506）"
          if [ "$rc" -eq 0 ]; then
            echo "::error::未知子命令 rc=0 ⇒ native 参数分派面退化"
            exit 1
          fi
          (cd _release/native && zip -qr "../fist-mbt-native-linux-x64-v$VER.zip" .)
          zrc=$?
          ZIP="_release/fist-mbt-native-linux-x64-v$VER.zip"
          if [ "$zrc" -ne 0 ] || [ ! -s "$ZIP" ]; then
            echo "::error::打包没成功（zip rc=$zrc，$ZIP 存在且非空=$([ -s "$ZIP" ] && echo yes || echo no)）"
            exit 1
          fi
          ls -la "$ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: fist-mbt-native-linux
          path: _release/fist-mbt-native-linux-x64-v${{ needs.meta.outputs.version }}.zip

  build-native-windows:
    needs: meta
    runs-on: windows-latest
    continue-on-error: true   # 527 治本后摘除（另见 BUG-506：Windows 未知子命令 rc=0 未修）
    steps:
      - uses: actions/checkout@v4

      # BUG-513：原 `curl …/install/windows -o moonbit.zip` 实测 403（BUG-513 遗留①，账本明记
      # 「不猜 URL」）⇒ 照抄 ci.yml:510-519 已在 windows-latest runner 上跑通的形状：
      # `irm …/install/powershell.ps1 | iex` + 显式把 moon 写进 GITHUB_PATH。
      - name: Install MoonBit toolchain (Windows)
        env:
          # BUG-513 出路①：钉版来自 toolchain.json（经 meta 作业读出），不再 'latest'
          MOON_VERSION: ${{ needs.meta.outputs.moonbit }}
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex

      - name: Add moon to PATH
        shell: pwsh
        run: |
          "$HOME\.moon\bin" | Out-File -Append $env:GITHUB_PATH
          "$env:USERPROFILE\.moon\bin" | Out-File -Append $env:GITHUB_PATH

      # run 41278260017 / job 124764780649 实测根因：原「Load VS DevShell + sqlite」步在
      # pwsh 步**进程内** dot-source native-env.ps1 —— $env:INCLUDE/LIB 的修改不跨步骤
      # （Actions 每步起新 shell），后续 bash 步「Build native」既没有 cl.exe 也没有
      # INCLUDE/LIB ⇒ moonc 阶段 41 warnings 0 errors、14 秒后链接段红且真错误没进日志。
      # ⇒ 本步重写：① 实测 URL 下载 SQLite amalgamation（形状检查：PK 魔数 + 解压含
      #    sqlite3.h/sqlite3.c，HTTP 200 != 拿到文件，BUG-107 前科）；
      # ② **同一进程**装载 VS（native-env.ps1，失败走 vswhere+DevShell 兜底，不静默）；
      # ③ cl 编 sqlite3.c + lib 归档成 lib\sqlite3.lib（落在 checkout 目录）；
      # ④ INCLUDE/LIB **全量**写 $env:GITHUB_ENV —— 这是跨步骤传递的正解，
      #    Build native 的 bash 会作为子进程继承。
      # 三个候选 URL 均于 2026-11-01 实测（curl -sIL）：200 + application/zip，
      # 按新旧排序逐个试，前一个失效自动落到下一个（只对「拿不到 zip」换源，非传输抖动重试）。
      - name: Install SQLite dev + export build env
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "https://www.sqlite.org/2026/sqlite-amalgamation-3510200.zip",
            "https://www.sqlite.org/2025/sqlite-amalgamation-3510100.zip",
            "https://www.sqlite.org/2025/sqlite-amalgamation-3500400.zip"
          )
          # ---- 1) 下载（候选逐试 + PK 魔数形状检查） ----
          $zip = Join-Path $env:RUNNER_TEMP "sqlite-amalgamation.zip"
          $gotZip = $false
          foreach ($u in $candidates) {
            Write-Host "[win-native] GET $u"
            curl.exe -sSL --max-time 180 -o "$zip" "$u"
            if ($LASTEXITCODE -ne 0) { Write-Host "  curl rc=$LASTEXITCODE，换下一候选"; continue }
            $magic = Get-Content -AsByteStream -TotalCount 2 "$zip"
            if ($magic[0] -eq 0x50 -and $magic[1] -eq 0x4B) { $gotZip = $true; break }
            Write-Host "  200 拿到的不是 zip（无 PK 魔数，BUG-107 前科），换下一候选"
          }
          if (-not $gotZip) {
            Write-Host "::error::[下载失败] 全部候选 URL 都没拿到有效 zip（curl 非零或 PK 魔数检查不过）"
            exit 1
          }
          # ---- 2) 解压 + 形状检查（必须含 sqlite3.h 与 sqlite3.c） ----
          $exDir = Join-Path $env:RUNNER_TEMP "sqlite-amalgamation"
          Expand-Archive -Path "$zip" -DestinationPath $exDir -Force
          $h = Get-ChildItem -Recurse $exDir -Filter sqlite3.h | Select-Object -First 1
          $c = Get-ChildItem -Recurse $exDir -Filter sqlite3.c | Select-Object -First 1
          if (-not $h -or -not $c) {
            Write-Host "::error::[解压失败] zip 解开了但里面找不到 sqlite3.h / sqlite3.c"
            exit 1
          }
          $root = (Get-Location).Path
          New-Item -ItemType Directory -Force (Join-Path $root "include"), (Join-Path $root "lib") | Out-Null
          Copy-Item $h.FullName (Join-Path $root "include\sqlite3.h")
          Copy-Item $c.FullName (Join-Path $root "lib\sqlite3.c")
          # ---- 3) 同一进程装载 VS（native-env.ps1 优先，vswhere+DevShell 兜底；不静默） ----
          $clOk = $false
          if (Test-Path scripts/native-env.ps1) {
            try {
              . scripts/native-env.ps1 -SqliteDev $root
              if (Get-Command cl.exe -ErrorAction SilentlyContinue) { $clOk = $true }
            } catch {
              Write-Host "[win-native] dot-source native-env.ps1 失败：$_ —— 走兜底"
            }
          }
          if (-not $clOk) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              Write-Host "::error::[环境装载失败] vswhere 不在，VS Build Tools 无法探测"
              exit 1
            }
            $inst = & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
            if (-not $inst) {
              Write-Host "::error::[环境装载失败] vswhere 找不到含 VC.Tools.x86.x64 的 VS 实例"
              exit 1
            }
            Import-Module (Join-Path $inst "Common7\Tools\Microsoft.VisualStudio.DevShell.dll")
            Enter-VsDevShell -VsInstallPath $inst -SkipAutomaticLocation -DevCmdArguments "-arch=x64" | Out-Null
            $env:INCLUDE = "$(Join-Path $root "include");$env:INCLUDE"
            $env:LIB = "$(Join-Path $root "lib");$env:LIB"
            if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
              Write-Host "::error::[环境装载失败] 兜底装载后 cl.exe 仍不在 PATH"
              exit 1
            }
          }
          # ---- 4) 编 sqlite3.c → lib\sqlite3.lib（checkout 目录下） ----
          Push-Location (Join-Path $root "lib")
          try {
            cl /nologo /c /O2 sqlite3.c
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::[编译失败] cl /c sqlite3.c rc=$LASTEXITCODE"
              exit 1
            }
            lib /nologo /OUT:sqlite3.lib sqlite3.obj
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::[编译失败] lib /OUT:sqlite3.lib rc=$LASTEXITCODE"
              exit 1
            }
          } finally { Pop-Location }
          # ---- 5) PATH 也要导：cl/link 的目录写 GITHUB_PATH（run 41278899034 实测：
          #      INCLUDE/LIB 落了 GITHUB_ENV，但 cl.exe 不在后续 bash 步的 PATH 上，
          #      moon 原生后端在 moonc 阶段之后立刻红且真错误被吞 ⇒ PATH 与 $env: 一样不跨步骤） ----
          $clDir = Split-Path (Get-Command cl.exe).Source -Parent
          $linkDir = Split-Path (Get-Command link.exe).Source -Parent
          foreach ($d in @($clDir, $linkDir)) {
            if ($d) { Add-Content $env:GITHUB_PATH $d }
          }
          # ---- 6) INCLUDE/LIB 全量写 GITHUB_ENV（跨步骤传递；含换行才用 heredoc 形状） ----
          if ([string]::IsNullOrEmpty($env:INCLUDE) -or [string]::IsNullOrEmpty($env:LIB)) {
            Write-Host "::error::[环境导出失败] INCLUDE 或 LIB 为空，无东西可导出"
            exit 1
          }
          foreach ($name in @("INCLUDE", "LIB")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value.Contains("`n") -or $value.Contains("`r")) {
              $delim = "FIST_ENV_$($name)_DELIM"
              [IO.File]::AppendAllText($env:GITHUB_ENV, "$name<<$delim`n$value`n$delim`n")
            } else {
              [IO.File]::AppendAllText($env:GITHUB_ENV, "$name=$value`n")
            }
          }
          # ---- 7) 自检（lib >0 字节 + sqlite3.h 在 INCLUDE 上可解析 + GITHUB_ENV 真写进去了） ----
          $libFile = Join-Path $root "lib\sqlite3.lib"
          if (-not (Test-Path $libFile) -or (Get-Item $libFile).Length -le 0) {
            Write-Host "::error::[编译失败] lib\sqlite3.lib 不存在或为 0 字节"
            exit 1
          }
          $incHit = $false
          foreach ($p in ($env:INCLUDE -split ';')) {
            if ($p -and (Test-Path (Join-Path $p "sqlite3.h"))) { $incHit = $true; break }
          }
          if (-not $incHit) {
            Write-Host "::error::[环境导出失败] INCLUDE 里没有任何一条路径能解析到 sqlite3.h"
            exit 1
          }
          $envFace = [IO.File]::ReadAllText($env:GITHUB_ENV)
          if (-not ($envFace -match '(?m)^INCLUDE=') -or -not ($envFace -match '(?m)^LIB=')) {
            Write-Host "::error::[环境导出失败] GITHUB_ENV 里没看到 INCLUDE= / LIB= 行"
            exit 1
          }
          $pathFace = [IO.File]::ReadAllText($env:GITHUB_PATH)
          if (-not $pathFace.Contains($clDir) -or -not $pathFace.Contains($linkDir)) {
            Write-Host "::error::[环境导出失败] GITHUB_PATH 里没看到 cl/link 的目录"
            exit 1
          }
          Write-Host "[win-native] 自检通过：lib\sqlite3.lib=$((Get-Item $libFile).Length) 字节；sqlite3.h 在 INCLUDE 上；INCLUDE/LIB 已落 GITHUB_ENV；cl/link 目录已落 GITHUB_PATH"

      # 与 build-native-linux 同源（run 41278010595 实测缺这步红在 Migrate）：
      # runner 上注册表索引为空，`moon check` 只会回 "module was not found in the
      # registry" ×N（日志原文），必须先 `moon update` 拉索引，migrate 的解包才有的可解。
      - name: Refresh registry (first build)
        run: moon update

      # BUG-490（R87 补）：**Windows 臂也缺 migrate 先解包** —— 与 build-js / build-native-linux
      # 同雷（依赖惰性解包，新版 moon 拒旧 `moon.mod.json` ⇒ 解析依赖图即失败 ⇒ 本 job 红
      # ⇒ 少一个 Windows native 资产）。`continue-on-error: true` 让它**不阻塞 release**，
      # 所以这缺口**长期静默**：Release 一直少一个资产，而 CI 只看到「有个 job 黄了」。
      #
      # 为什么 `shell: bash`：与 ci.yml 的 windows 臂（:522）同款 —— windows-latest 自带 Git Bash，
      # 那支迁移器内含 build 探针、exit 0 即依赖图已通。**照抄已验证的先例，不另造写法。**
      - name: Migrate mooncakes dep manifests (先解包，与 js/linux 臂同雷)
        shell: bash
        run: bash scripts/migrate_mooncakes_modjson.sh "moon check --target native"

      # BUG-513 修法②：照抄 build-native-linux 臂的步骤序列 —— Reapply BUG-133 是承重件
      # （不 reapply 的产物 `version`/`--help` 一用就崩 rc=134，见 linux 臂同步骤注释）。
      - name: Reapply BUG-133 sqlite FFI fix
        run: bash patches/sqlite-bug133/reapply.sh --force

      # 本机实测链（run 41278899034 / 41279525445 之后，本机 Git Bash + INCLUDE/LIB/PATH 复现）：
      # moonc 把 cmd/cli/moon.pkg 的 cc-link-flags "-lsqlite3" **原样**传给 MSVC link.exe，
      # link 报 LNK4044「无法识别的选项 /lsqlite3；已忽略」⇒ 44 个 sqlite3_* 全部 LNK2019，
      # 而 moon 只回 "failed when building project"，真错误被吞 ⇒ 两发 dispatch 都红在同一层。
      # MSVC 需要裸 "sqlite3.lib"（link 自行按 LIB 搜库）；"-lsqlite3" 只有 Linux/gcc 臂用。
      # 本步只在本臂、只改 runner 工作副本（不提交任何 moon.pkg），幂等；形状漂了宁可红。
      - name: Patch cc-link-flags for MSVC (link.exe ignores -lsqlite3)
        shell: bash
        run: |
          set -euo pipefail
          f=cmd/cli/moon.pkg
          if grep -q '"cc-link-flags": "sqlite3.lib"' "$f"; then
            echo "[msvc-link] 已是 MSVC 形状，幂等跳过"
          elif grep -q '"cc-link-flags": "-lsqlite3"' "$f"; then
            sed -i 's/"cc-link-flags": "-lsqlite3"/"cc-link-flags": "sqlite3.lib"/' "$f"
            grep -q '"cc-link-flags": "sqlite3.lib"' "$f"
            echo "[msvc-link] 已改写为 MSVC 形状（本工作副本内，不提交）"
          else
            echo "::error::[msvc-link] cmd/cli/moon.pkg 里两种 cc-link-flags 形状都找不到——上游形状漂了，宁可红不静默"
            exit 1
          fi

      - name: Build native
        # 与 linux 臂对齐：scoped 只建 cmd/cli（全项目 `moon build --target native` 红在
        # 库包带 link 被 moon 去链 ⇒ `undefined reference to 'main'`，BUG-527 治理）。
        run: bash scripts/migrate_mooncakes_modjson.sh "moon build --target native cmd/cli"

      - name: Package native artifact
        run: |
          New-Item -ItemType Directory -Force _release/native | Out-Null
          Copy-Item _build/native/debug/build/cmd/cli/cli.exe _release/native/fist-mbt.exe
          Compress-Archive -Path _release/native/* -DestinationPath "_release/fist-mbt-native-win-x64-v${{ needs.meta.outputs.version }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: fist-mbt-native-win
          path: _release/fist-mbt-native-win-x64-v${{ needs.meta.outputs.version }}.zip

  release:
    # BUG-111 两处一起修：
    # ① 原来 needs 里只有 build-js / build-native-linux，正文却引用 needs.meta.outputs.version
    #    ——`meta` 不在自己的 needs 里，这个引用取不到值（Release 名与资产名都会漂成空版本形态）；
    #    同文件里 build-js 等作业是 `needs: meta` 才拿到 version 的，release 这一格漏了。
    # ② JS 安装线只吃 build-js 的产物，却被**可选的** native 作业一票否决 ⇒ 一次 native 编译失败
    #    就等于 Release 全无资产（本机快照实测 JS 三步全通过，资产却一个也没出）。
    needs: [meta, build-js]
    # 只有**tag push** 才许动公网 Release。这条不是分支门（J12 禁的是 `refs/heads/` 那种钉法，
    # 分支一变就恒假），而是「事件 + tag 前缀」双条件：
    # 2026-10-31 实测本文件有 `workflow_dispatch`，而 `release` 作业的 `tag_name: ${{ env.TAG }}`
    # 读的是 `github.ref_name` —— 手动派发时它是**分支名**（如 main），softprops 会照着
    # 创建一个 tag 名为 `main` 的 Release（名字还写着 FIST-Mbt v0.3.11）⇒ 平白多一条公开假交付物。
    # 派发照旧产出 workflow 产物（各 build-* 作业与 upload-artifact 不受影响），只是不许顶掉发布面。
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: _artifacts
          merge-multiple: true

      - name: Display artifacts
        run: ls -la _artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: FIST-Mbt v${{ needs.meta.outputs.version }}
          prerelease: ${{ contains(env.TAG, '-') }}
          generate_release_notes: true
          files: _artifacts/*.zip
