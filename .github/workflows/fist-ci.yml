name: FIST CI — Build + Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # ---------- JS target ----------
  test-js:
    name: check + test (js, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry
        run: moon update

      - name: Check (js)
        run: moon check --target js

      - name: Test (js)
        run: set -o pipefail; moon test --target js 2>&1 | tee /tmp/moon_js_test.log

      - name: Format check
        run: |
          moon version --all
          moon fmt --check

      - name: Moon info
        if: runner.os == 'Linux'
        run: moon info

  # ---------- Native target ----------
  test-native:
    name: check + test (native, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system deps (sqlite3 + build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev build-essential

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry
        run: moon update

      - name: Check (native)
        run: moon check --target native

      # -j 1 串行跑 native 测试（native sqlite3 在并发下可能不稳定）
      - name: Test (native, j=1)
        run: moon test --target native -j 1

  # ---------- Nightly self-check on main ----------
  # 仅 push 到 main 时触发（PR 不跑 nightly 巡检）
  # 依赖 test-js + test-native 都通过
  nightly:
    name: nightly self-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test-js, test-native]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install system deps (sqlite3)
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev build-essential

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry
        run: moon update

      - name: Build native
        run: moon build --target native

      # 预留：native target 跑 run_check / issue_scan 自驱巡检
      # run_check 在 native 下能真实访问 sqlite3 存储层，更完整
      - name: Run native self-check (skeleton)
        run: |
          echo "// TODO: moon run --target native cmd/cli"
          echo "// → MCP call tools/call run_check / tools/call issue_scan"
          echo "// native target 下 sqlite3 真实可用，巡检覆盖更全"
