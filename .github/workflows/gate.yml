name: FIST Gate

# Unified Tier2 gate chain on every PR touching master/main.
# Runs scripts/fist-gate.py (merge_markers/fmt/build/ps_encoding/store_path).
# rc semantics: 0=pass 1=fail 2=degraded -> gate action fails on rc>=1.
on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  gate:
    name: unified gate chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry (first build)
        run: moon update

      # fist-gate.py 的 ck_fmt 走 `moon fmt --check`；该判据在格式化器未预热时
      # 恒报 DEGRADED（rc=2 ⇒ 门链 rc>=1 失败），让 gate.yml 在干净 runner 上
      # 永远红（BUG-388 在 CI 侧的复现面）。这里先跑一次写模式 `moon fmt` 把
      # _build/wasm-gc/release/format/ 预热出来，ck_fmt 才有真判据可依；
      # 若分支代码确有格式差异，ck_fmt 会按 hard red 报出，门链照样拦得住。
      - name: Warm formatter so `moon fmt --check` is decidable (BUG-388 CI side)
        run: moon fmt

      - name: Run unified gate chain
        run: python3 scripts/fist-gate.py
