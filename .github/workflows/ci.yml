name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check-and-test-js:
    name: check + test (js, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry (first build)
        run: moon update
        env:
          # 从公开 mooncakes registry 拉取；无私有依赖
          MOON_REGISTRY_UPDATE: "1"

      - name: Check (js)
        run: moon check --target js

      - name: Format check (BUG-118：格式门住在权威 CI，不只在狗食轨)
        shell: bash
        # 把打这条红用的工具链版本留在日志里：BUG-118 的未定案项是"两条轨的 moon 版本不同形"，
        # 没有版本自述，下一轮就只能在猜
        run: |
          moon version --all
          moon fmt --check

      - name: Test (js)
        run: set -o pipefail; moon test --target js 2>&1 | tee /tmp/moon_test.log

      - name: Badge consistency guard (README 徽章须与实测一致)
        shell: bash
        run: python3 scripts/check_badge.py /tmp/moon_test.log README.md

      - name: Tool-list single-source guard (AGENTS/README 工具与会注册对齐)
        shell: bash
        run: python3 scripts/check_tools_sync.py

      - name: Test-count single-source guard (全量现状面测试总数==实测 + 豁免有效性)
        shell: bash
        run: python3 scripts/check_test_sync.py /tmp/moon_test.log

      - name: Test-count guard selftest (BUG-50：判据必须先证明自己会红)
        shell: bash
        run: python3 scripts/check_test_sync.py --selftest

      - name: Scripts-index guard (工具类辅助代码统一登记 scripts/README)
        shell: bash
        run: python3 scripts/check_scripts_index.py

      - name: Plugin-form guard cl7 (一源四态：四宿主插件目录==真源投影)
        shell: bash
        run: |
          python3 scripts/gen_plugins.py --check
          python3 scripts/gen_plugins.py --selftest
          python3 scripts/check_plugin_sync.py

      - name: Doc-surface guard (文档逐个工具可查/分组和==实测/自述版本==moon.mod；BUG-89 自检同跑)
        shell: bash
        run: |
          python3 scripts/check_doc_surface.py --selftest
          python3 scripts/check_doc_surface.py

      - name: Store-schema wiring guard (BUG-28：每张表要么有写入点要么显式声明预留)
        shell: bash
        run: |
          python3 scripts/check_store_tables_wired.py --selftest
          python3 scripts/check_store_tables_wired.py

      - name: PowerShell encoding guard (BUG-88：无 BOM 的非 ASCII .ps1 在 PS5.1 下解析期即炸)
        shell: bash
        run: |
          python3 scripts/check_ps_encoding.py --selftest
          python3 scripts/check_ps_encoding.py

      - name: Entry-list guard (BUG-93/101：现状面不得指退役入口；Popen argv 必须带 serve)
        shell: bash
        run: |
          python3 scripts/check_entry_paths.py --selftest
          python3 scripts/check_entry_paths.py

      - name: Spawn-plane isolation guard (BUG-122：demo/自检脚本裸跑不许写仓库根自举台账)
        shell: bash
        run: |
          python3 scripts/check_demo_isolation.py

      - name: Publish payload guard (BUG-127：`moon publish` 打的是工作树－.gitignore，不是 git 跟踪面)
        shell: bash
        run: |
          python3 scripts/check_publish_payload.py --selftest
          python3 scripts/check_publish_payload.py
          python3 scripts/check_demo_isolation.py

      - name: Release asset-name single source (BUG-103：安装器版本真源=moon.mod，空值必须失败)
        shell: bash
        run: |
          python3 scripts/check_release_asset_names.py --selftest
          python3 scripts/check_release_asset_names.py

      - name: Self-described surface guard (BUG-104：resources/prompts/版本 自述面判据的 12 支对照)
        shell: bash
        run: |
          python3 scripts/mcp_tool_tour.py --surface-selftest

      - name: Store-isolation probe (BUG-90：FIST_DB_PATH 必须真的改道，两格成对 + 合成违例)
        shell: bash
        run: |
          moon build --target js cmd/cli
          python3 scripts/patch_esm_main.py _build/js/debug/build/cmd/cli/cli.js
          python3 scripts/store_isolation_probe.py --selftest

      - name: Heartbeat cross-process guard (BUG-119：判活必须打到两个真进程)
        shell: bash
        # 单元测试用 MemoryStore + 同进程心跳对象，结构上照不到这一格；
        # 这条常驻 e2e 起两个真 `node cli.js serve`，锁「无心跳行不等于首拍即死」与跨进程心跳可见
        run: |
          moon build --target js cmd/cli
          python3 scripts/blackbox/e2e_heartbeat_xproc.py

      - name: CLI call-site probe (BUG-106/114：旗、退出码、版本自述必须打到入口面)
        shell: bash
        # 复用上面那一步的 cmd/cli 产物：白盒测试钉的是 parse_subcmd，
        # 入口被改回字符串 match 或源码常量落后时它照样全绿 —— 这里起真产物看真 rc。
        run: |
          python3 scripts/cli_flag_probe.py --selftest
          python3 scripts/cli_flag_probe.py

      - name: Cleanliness guard (仓库整洁，仅交付库 fist-mbt.db)
        shell: bash
        run: python3 scripts/cleanup_artifacts.py && python3 scripts/cleanup_artifacts.py --check

  check-native:
    name: check + test (native, ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps for native sqlite
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Refresh registry (first build)
        run: moon update

      - name: Check (native)
        run: moon check --target native

      # 2026-10-01 owner 裁决 BUG-130 出路③：native 测试轨改由常驻判据当门，不再让无人解释的红当读数。
      # 这一步原先是 `moon test --target native`，从 09-28 起恒红在
      # `Failed to run the test: …engine.blackbox_test.exe` + `exited with signal: 11 (SIGSEGV) (core dumped)`，
      # 日志里没有原因（账本 BUG-130）。定因结论：根在依赖侧的 native FFI（BUG-133），不在本仓逻辑。
      # 现在这一步跑「只调该依赖公开 API、零本仓业务码」的探针，把同一个失效面变成可数的读数；
      # 判据方向**刻意反向**：crashes=0/12 才 exit 0 ⇒ 下一步的全量 native 测试才会跑（步骤不删，
      # 免得留「以后要记得改回来」的债）；缺陷在场时红话逐字点名 BUG-133 与它的转正前置。
      # 先跑 --selftest：它含一格「明知编译不过的探针必须被构建门拒掉」，posix + moon 在场才真跑，
      # 不在场会显式打 SKIPPED（这一格没跑到）—— 尺子自己坏了就不许拿它的读数当 native 结论。
      # 读法两种都算解释过：门红 = BUG-133 在场；**门绿而下一步 Test (native) 仍被信号打死** = 12 次抽检
      # 没抽中（同一支尺、同一次会话连跑两发给出过 3/12 与 0/12 两端 ⇒ 0/N 是抽样性质），不是又冒出一条新缺陷。
      - name: Native heap gate (BUG-133 探针当门)
        run: |
          python3 scripts/blackbox/e2e_native_heap_probe.py --selftest
          python3 scripts/blackbox/e2e_native_heap_probe.py --runs 12

      - name: Test (native)
        # 这一步的红**照原样退出**（exit "$rc"，不加 continue-on-error），只是补一条 ::error:: 将根因与
        # 「门绿 ≠ 已修」的读法写进 annotations——2026-10-02 那发权威 CI 就是门绿（#7）而这一格红（#8）。
        run: |
          rc=0
          moon test --target native || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::BUG-133 的读面：native 测试二进制以 rc=$rc 收场（既往形态 = 被信号打死 / core dumped）。上面是 moon 的原文与门那一步的 TALLY；**门绿只代表这一次 12 抽没抽中**（同一支尺同一次会话连跑两发给出过 3/12 与 0/12），不代表已修。关闭条件见账本 BUG-133：抽检连发 0 崩溃 + `git archive HEAD` 干净树全量通过。"
          fi
          exit "$rc"

  check-windows-js:
    name: check + test (js, windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install MoonBit toolchain (Windows)
        shell: pwsh
        run: |
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex

      - name: Add moon to PATH
        shell: pwsh
        run: |
          "$HOME\.moon\bin" | Out-File -Append $env:GITHUB_PATH
          "$env:USERPROFILE\.moon\bin" | Out-File -Append $env:GITHUB_PATH

      - name: Refresh registry (first build)
        shell: pwsh
        run: moon update

      - name: Check (js)
        shell: pwsh
        run: moon check --target js

      - name: Test (js)
        shell: pwsh
        run: moon test --target js

      - name: Tool-list single-source guard (AGENTS/README 工具与会注册对齐)
        shell: pwsh
        run: python scripts/check_tools_sync.py

      - name: Public install line e2e (BUG-116：文档那条线要真装通，公网侧取证)
        shell: pwsh
        # 观测臂，不是一票否决：BUG-116 的教训正是"链路侧红不是产品红"（本机 9/9 传输层被对端
        # 关闭、同一时刻 curl 得 200+PK）。这条在 runner 上跑绿就是 BUG-116 的关闭证据；
        # 跑红时先看回执里打的是传输层错误还是 404/HTML 形状——前者是环境，后者才是产品。
        continue-on-error: true
        run: python scripts/blackbox/e2e_irm_line.py