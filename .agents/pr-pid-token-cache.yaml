body: |
  ## 病灶：注释与实现双重违约（T0r5 新功能）
  `fn current_pid_token()`（src/server/server.mbt）注释写：
  > 退化为 `now_ms / 1000 % 2000000000` 的 Int32（进程启动即固定一次，生命周期内不变）

  但函数体**每次调用都重取 `@env.now()`**：

  ```mbt
  fn current_pid_token() -> Int32 {
    let ms = @env.now().reinterpret_as_int64()  // ← 每次调用取当前时钟
    ...
    (ms / 1000L % 2000000000L).to_int()
  }
  ```

  ## 影响：安全门把好人挡门外
  同一进程内 `agent_touch_first_seen`（用当时的 `current_pid_token()` 注册 pid）后过几秒，
  `agent_write_gate`（claim/execute 写面硬门）里 `current_pid_token()` 就与注册时不同 ⇒
  `agents_acl_check` 的 `pid_bound=1` 分支误报
  「ACL 绑定旧进程实例（pid 已换）」**把合法写操作拒掉**。

  ## 测试盲区：注释与实现的双重违约无人钉
  `src/store/store_sqlite_agents_wbtest.mbt`（本功能配套测试）恒传**硬编码** `current_pid`（123/999），
  **从未调 `current_pid_token()`**——秒级漂移零覆盖，契约破坏无人拦。

  ## 修法：首次调用固化缓存
  ```mbt
  let cached_pid_token : Array[Int32] = Array::make(1, -1)  // MoonBit 顶层不支持 let mut，用单元素容器

  fn current_pid_token() -> Int32 {
    if cached_pid_token[0] >= 0 {
      return cached_pid_token[0]
    }
    let ms = @env.now().reinterpret_as_int64()
    if ms < 0L {
      return 0
    }
    cached_pid_token[0] = (ms / 1000L % 2000000000L).to_int()
    cached_pid_token[0]
  }
  ```
  首次调用固化，之后恒返回同一 pid——注释承诺兑现。

  ## 白盒锁：新增 `pid_token_wbtest.mbt`（2 条）
  ① 首次调用固化缓存（读容器状态断言）
  ② 后续调用复用同一值（多次调用恒等）

  **有效性验证**：`git stash push src/server/server.mbt` 还原原版后，测试文件**编译即败**
  （`cached_pid_token` 未定义）⇒ 契约破坏可被钉住，不再依赖「同秒碰巧相等」的假绿测试。

