id: BUG-390-397-398-399-400-backfill-wiring
branch: fix/backfill-ghost-bugs
title: "治理收口：回填 4 个幽灵 BUG 编号（390/397/398/399）+ 接线两个从没跑过的守卫（BUG-400）"
base: main
