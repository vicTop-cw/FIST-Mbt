<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>FIST-Mbt 任务看板 (M0)</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; }
        #status { margin-bottom: 20px; padding: 10px; background: #f0f0f0; border-radius: 4px; }
        .task-card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .task-tree { margin-left: 20px; border-left: 2px solid #ccc; padding-left: 10px; }
        .status-done { background: #d4edda; }
        .status-running { background: #fff3cd; }
        .status-pending { background: #e2e3e5; }
        button { margin-top: 10px; padding: 5px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>FIST-Mbt 任务看板 (M0 · 只读)</h1>
    <div id="status">加载中...</div>
    <div id="tasks"></div>
    <button onclick="location.reload()">刷新</button>
    
    <script>
        // BUG-138 同族：Windows cp936 控制台下中文 print 会崩，但这里浏览器环境无此问题。
        const PORT = new URL(location.href).port || '3137';
        const BASE = `http://127.0.0.1:${PORT}`;
        
        async function main() {
            try {
                const resp = await fetch(`${BASE}/api/status`);
                if (!resp.ok) throw new Error('连不上桥');
                const data = await resp.json();
                document.getElementById('status').innerHTML = 
                    `版本 ${data.status.version} | 总任务 ${data.status.total_tasks} | 活跃空间：${data.status.active_namespaces.join(', ') || '无'}`;
                
                const tasksResp = await fetch(`${BASE}/api/tasks?ns=`);
                if (!tasksResp.ok) throw new Error('取不到任务列表');
                const flat = await tasksResp.json();
                drawTaskTree(flat);
                console.log("DASHBOARD OK");
            } catch (e) {
                document.getElementById('status').innerHTML = 
                    `<strong style="color:red">错误：${e.message}</strong><br/>请先起 python scripts/fist-mbt-web.py`;
            }
        }
        
        function drawTaskTree(flat) {
            const root = document.getElementById('tasks');
            root.innerHTML = '';
            const byParent = {};
            flat.forEach(t => { byParent[t.parent_id || ''] = (byParent[t.parent_id || ''] || []).concat([t]); });
            
            function buildNode(nodeId, depth) {
                const parentTasks = byParent[nodeId] || [];
                parentTasks.forEach(t => {
                    const div = document.createElement('div');
                    div.className = `task-card status-${t.status || 'pending'}`;
                    div.style.marginLeft = `${depth * 20}px`;
                    div.innerHTML = 
                        `<strong>${t.task_id || '?'}:</strong> ${t.description || '(无描述)'}<br/>` +
                        `状态：${t.status} | 难度：${t.difficulty || '?'}`;
                    
                    const children = buildNode(t.task_id, depth + 1);
                    if (children.length > 0) {
                        const treeDiv = document.createElement('div');
                        treeDiv.className = 'task-tree';
                        children.forEach(c => treeDiv.appendChild(c));
                        div.appendChild(treeDiv);
                    }
                    root.appendChild(div);
                });
                return [root];
            }
            buildNode('', 0);
            console.log("TREE DRAWN");
        }
        
        main();
    </script>
</body>
</html>
