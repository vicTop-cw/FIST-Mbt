id: TASK-007
title: "run_guards.py 宇宙扩展 — 漏检 64 个脚本含 blackbox e2e"
priority: P1
status: done
assignee: atomcode
discovered_by: whisperer
discovered_at: "2026-10-21T20:12:00+08:00"

problem: >
  风语者首轮巡检：run_guards.py `--list` 只列 26 个脚本，
  实际 scripts/ 目录（含子目录）有 90 个 py 文件 → **漏检 64 个**。
  
  上轮合入者只修了 blackbox/check_merge_markers.py 这 1 个文件进宇宙（commit 2fa9df31），
  但 blackbox/ 下实际有 **10 个 e2e 探针**（e2e_mirror_install.py / e2e_native_heap_probe.py /
  e2e_irm_line.py 等）全在漏检列表里。
  
  还有 50+ 个 scripts/ 顶层测试/验证脚本（verify_* / selfdrive / caf_*）也没被 run_guards 覆盖。
  
  根因：run_guards.py 的 CASES 数组是手写清单，不是自动扫描。

scope:
  - scripts/run_guards.py（改 CASES 从手写到自动扫描 + 前缀过滤）
  - scripts/blackbox/e2e_*.py（10 个探针全部进宇宙）
  - 决策：test_*/verify_*/selfdrive/ 这些要不要进（测试脚本 vs 门禁脚本的边界）

acceptance:
  - [ ] run_guards.py 从手写 CASES 改为：扫描 scripts/**/*.py → 过滤掉 test_/verify_/selfdrive_ → 自动生成 CASES
  - [ ] 所有 scripts/blackbox/*.py 进入宇宙（之前合入者只加了 check_merge_markers.py）
  - [ ] run_guards.py --list 覆盖数从 26 → 至少 40+
  - [ ] 不引入回归：原来的 expected("check_plan_landing.py", 1, ...) 这种诊断型 case 保留

evidence: |
  风语者 20:11 实测：
  run_guards.py --list 输出 26 行（每个一行带 CI=CI 电池=电池）
  scripts/ 递归 Get-ChildItem *.py → 90 个文件
  差集 = 64 个文件漏检
  其中 blackbox/ 下的 e2e_*.py 有 10 个

blocked_by: []

# ── 执行回填（AtomCode / 2026-10-21T20:55+08:00）──
result: >
  已实现并自证。宇宙改为**递归扫描 scripts/**/*.py + 分类规则**（不再是手写清单）：
    门禁尺 GATE_PREFIXES = check_ / e2e_ / run_ / gen_plugins / cleanup_ / store_isolation /
      fist-gate / cli_flag_probe ⇒ 必须至少一个执行面（CI 或电池），否则 G1 红；
    其余必须命中 EXEMPT_RULES（前缀/后缀 + **理由**）并在 --list 逐条印出；
    两类都不命中 ⇒ G1 按「未归类」报红（新增脚本必须当场归类，不许靠没人发现混进仓）。
  CASES 自动生成：有 `--selftest` 的门禁尺若未手写条目，自动补一格（手写 expected/diag/gated 优先，
  诊断型期望值不被自动生成冲掉）。
  实测：--list 26 → **43 把门禁尺**（CI 28 / 电池 39 / 缺面 0 / 豁免 45 带理由 / 未归类 0）；
  电池 36 → **50 格，失败 0，SKIP 7**；selftest 13 → **18 格**全绿。
  4 个无 --selftest 的 e2e 探针（e2e_irm_line / e2e_mirror_install / e2e_transport_stack_fallback /
  e2e_upgrade_mirror）显式列入 KNOWN_NO_FACE 并在 --list 印「待接线 + 缺什么」，不计入缺面——
  「豁免」= 决定不进电池，「待接线」= 该进而还没接，两者分开记。
acceptance_met:
  - "CASES 自动扫描生成：✅（递归 + 前缀过滤 + selftest 自动补格）"
  - "所有 scripts/blackbox/*.py 进宇宙：✅（10 个 e2e + check_merge_markers；4 个待接线点名）"
  - "--list 26 → 40+：✅ 43"
  - "不引入回归（诊断型 expected 保留）：✅（check_plan_landing 诊断格等原样保留）"
