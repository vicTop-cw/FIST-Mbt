id: TASK-002
title: "cherry-pick 黑名单 — src/ops/moon.pkg + rhop_poll.mbt"
priority: P1
status: in_review
assignee: atomcode
discovered_by: lead
discovered_at: "2026-10-21T17:30:00+08:00"

problem: >
 cherry-pick 旧 commit 时，src/ops/moon.pkg 总会带冲突标记（AtomCode 的旧分支 moon.pkg 版本
 与 HEAD 不同且自带标记）。同时 rhop_poll.mbt 是 poison——AtomCode 旧 commit 里加了这个文件，
 但 HEAD 已有 rhop_native.mbt 完整实现，两者同名函数 rhop_poll 冲突导致 build 崩。

 合入者的处理方式：cherry-pick 直接 abort，改用 git checkout <branch> -- src/server/xxx.mbt
 选择性拿 HEAD 里没有的文件，全程跳过 src/ops/ 目录。

scope:
  - slave-branch-merge.ps1（自动合入脚本）
  - AtomCode 自己日常 cherry-pick 工作流

acceptance:
  - [ ] slave-branch-merge.ps1 加 skip list: src/ops/moon.pkg, src/ops/rhop_poll.mbt, src/ops/rhop*.mbt
  - [ ] 脚本检测到 cherry-pick 带 src/ops/ 文件时自动 reset HEAD 这些文件
  - [ ] 任何 rhop_poll.mbt 出现都 rm + git rm + 合入者警告

evidence:
  - cherry-pick e1b1a9d3 时 src/ops/moon.pkg 冲突标记导致 moon build 报 [3002] lexing error @offset 134
  - git checkout 259b56a8 -- src/server/* 带入 rhop_poll.mbt 导致重复定义
  - HEAD 已有 rhop_native.mbt，功能完整且干净

blocked_by: []

# ── 执行回填（AtomCode / 2026-10-21T22:10+08:00）──
result: >
  `slave-branch-merge.ps1` 落 `$SKIP_EXACT = src/ops/moon.pkg, src/ops/rhop_poll.mbt` +
  `$SKIP_GLOB = src/ops/rhop*.mbt`，并新增 `Restore-Blacklisted`：**每次 cherry-pick 后立刻**执行
  （无论成败——冲突状态下这些路径最脏）：已跟踪件回退 HEAD、`rhop*.mbt` 若为旧 commit 新引入则
  **文件 + 索引一起删**并打印警告。**不是"取 theirs"，是"根本不收"**。
behavior_test: >
  在临时仓库真跑了一遍（非只读代码）：base 提交含 moon.pkg=HEAD-VERSION 与 rhop_native.mbt；
  "旧 commit"改 moon.pkg 为带标记内容并新增 rhop_poll.mbt；`cherry-pick --no-commit` 后调用该函数 ⇒
  输出「回退 HEAD: src/ops/moon.pkg / 删除（新引入）: src/ops/rhop_poll.mbt」，touched=2；
  断言三条全过：文件已删、索引已清、moon.pkg 回到 HEAD-VERSION 且无标记。
validation:
  - "PowerShell 真解析器 ParseFile：语法错误 0（不看自述）"
  - "check_ps_encoding PASS（BOM 保留，PS5.1 不会炸）"
  - "-DryRun 实跑：正常扫描并退出，工作树脏件数不变"
acceptance_met:
  - "skip list 三档：✅（exact 2 + glob rhop*.mbt）"
  - "cherry-pick 后自动 reset 这些文件：✅（Restore-Blacklisted 在 pick 后立即调用）"
  - "rhop_poll.mbt 出现即 rm + git rm + 告警：✅（行为测试实测）"
pr_branch: fix/task-002-cherry-pick-blacklist
