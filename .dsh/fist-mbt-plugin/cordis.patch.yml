# FIST-Mbt plugin patch.
#
# stdio transport → the built JS CLI at the repo root. Paths are absolute and
# `cwd` is pinned: the DSH Host's own cwd is not this repo, and the CLI resolves
# its relative args (and bootstraps its SQLite ledger) against the process cwd.
# Shapes mirror the repo's own tracked source of truth `.mcp.dev.json`, and the
# dsh-mcp-client Config schema (toolCallTimeoutMs, not timeout_ms).

- insert:
    - id: fist-mbt-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: 'fist-mbt'
        transport: 'stdio'
        command: 'node'
        args:
          - 'E:/IDEProjects/AI/FIST-Mbt/_build/js/debug/build/cmd/cli/cli.js'
          - 'serve'
        cwd: 'E:/IDEProjects/AI/FIST-Mbt'
        toolCallTimeoutMs: 30000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
