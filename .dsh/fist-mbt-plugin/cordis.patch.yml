# FIST-Mbt — local (this checkout) DSH bundle layer.
#
# This is the development install: it points straight at the checkout, and the
# shared launcher prefers the newest `_build/js/.../cli.js`, so a rebuild is
# picked up without editing this file. The published package uses the portable
# layer in `packaging/dsh/cordis.patch.yml`.

- insert:
    - id: fist-mbt-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: 'fist-mbt'
        transport: 'stdio'
        command: 'node'
        args:
          - 'F:/AI/Fist-Mbt/packaging/dsh/launch-mcp.mjs'
        cwd: 'F:/AI/Fist-Mbt'
        toolCallTimeoutMs: 300000
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 30000
          maxAttempts: 10
        env:
          FIST_PROJECT_DIR: 'F:/AI/Fist-Mbt'
